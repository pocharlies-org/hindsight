name: Triage labels

# Labels new issues as core / integration (via Gemini).
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    # INFRA-1218: job del upstream vectorize-io/hindsight; queda skipped en el fork
    if: github.repository == 'vectorize-io/hindsight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/triage-labels.py ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
